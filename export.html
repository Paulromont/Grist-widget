<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Export brut — recherche</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<!-- Bibliothèque Excel (xlsx). Sur l'instance INTERNE, héberger ce fichier sur le réseau et changer l'URL. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:#2E2E2E; margin:0; padding:20px; background:#fff;}
  h1{font-size:16px; color:#1F4E79; margin:0 0 4px;}
  p.info{font-size:13px; color:#6B7280; margin:0 0 16px;}
  .boutons{display:flex; gap:10px; flex-wrap:wrap;}
  button{font:inherit; cursor:pointer; border:none; border-radius:6px; padding:10px 16px;
     background:#1F4E79; color:#fff; font-weight:500; font-size:14px;}
  button.sec{background:#F4F5F7; color:#2E2E2E; border:1px solid #D8DCE1;}
  button:disabled{opacity:.5; cursor:default;}
  .etat{margin-top:14px; font-size:13px; color:#6B7280;}
  .etat.ok{color:#3B6D11;} .etat.err{color:#b42318;}
</style>
</head>
<body>
  <h1>Export brut (pour recherche par mot-clé)</h1>
  <p class="info">Une ligne par entité, avec ses actions (contrôles et entraves) en colonnes, triées par date. Jusqu'à 8 actions détaillées ; au-delà, regroupées dans « Actions supplémentaires ». N'exporte que les entités accessibles (votre département).</p>
  <div class="boutons">
    <button id="btnPM">Exporter les PM</button>
    <button id="btnPP">Exporter les PP</button>
    <button class="sec" id="btnTout">Exporter tout (PM + PP)</button>
  </div>
  <div class="etat" id="etat"></div>

<script>
/* ===== CONFIGURATION ===== */
const MAX = 8;   // nombre d'actions détaillées en colonnes

const ENTITE_PM = [
  {id:"Etat_du_dossier",label:"État du dossier",type:"text"},
  {id:"Affiliation",label:"Affiliation",type:"text"},
  {id:"Mouvance",label:"Mouvance",type:"text"},
  {id:"Pseudonyme",label:"Pseudonyme",type:"text"},
  {id:"Objectif",label:"Objectif",type:"text"},
  {id:"Departement",label:"Département",type:"text"},
  {id:"Ville",label:"Ville",type:"text"},
  {id:"Autres_adresses",label:"Autres adresses",type:"text"},
  {id:"Statut_juridique",label:"Statut juridique",type:"text"},
  {id:"Date_creation",label:"Date de création",type:"date"},
  {id:"Numero_RNA",label:"Numéro RNA",type:"text"},
  {id:"Numero_SIRET",label:"Numéro SIRET",type:"text"},
  {id:"Activite_presentiel_ligne",label:"Activité présentiel/en ligne",type:"text"},
  {id:"Domaine_declare_1",label:"Domaines déclarés",type:"list"},
  {id:"Domaine_reel_2",label:"Domaines réels",type:"list"},
  {id:"Date_signalement",label:"Date du signalement",type:"date"},
  {id:"Service_signalant",label:"Service signalant",type:"text"},
  {id:"Contenu_signalement",label:"Contenu du signalement",type:"text"},
  {id:"Commentaire_signalement",label:"Commentaire",type:"text"},
  {id:"Dirigeants",label:"Dirigeants",type:"text"},
  {id:"Personnels_benevoles",label:"Personnels bénévoles",type:"text"},
  {id:"_liees_Physique",label:"Personnes physiques liées",type:"liees",ref:"PM",groupe:"Physique"},
  {id:"_liees_Morale",label:"Personnes morales liées",type:"liees",ref:"PM",groupe:"Morale"},
  {id:"Points_vigilance",label:"Points de vigilance",type:"text"},
  {id:"Projet_controle",label:"Projet de contrôle",type:"text"},
  {id:"Dates_passage_CLIR",label:"Dates de passage en CLIR",type:"date"},
  {id:"Champs_libre",label:"Champs libre",type:"text"},
];

const ENTITE_PP = [
  {id:"Etat_du_dossier",label:"État du dossier",type:"text"},
  {id:"Pseudonyme",label:"Pseudonyme",type:"text"},
  {id:"sexe",label:"Sexe",type:"text"},
  {id:"Nationalite",label:"Nationalité",type:"text"},
  {id:"Affiliation",label:"Affiliation",type:"text"},
  {id:"Mouvance",label:"Mouvance",type:"text"},
  {id:"Objectif",label:"Objectif",type:"text"},
  {id:"Departement",label:"Département",type:"text"},
  {id:"Ville",label:"Ville",type:"text"},
  {id:"Activite_s_justfiant_le_suivi",label:"Activité(s) justifiant le suivi",type:"list"},
  {id:"Date_signalement",label:"Date du signalement",type:"date"},
  {id:"Service_signalant",label:"Service signalant",type:"text"},
  {id:"Contenu_signalement",label:"Contenu du signalement",type:"text"},
  {id:"commentaires",label:"Commentaires",type:"text"},
  {id:"_liees_Physique",label:"Personnes physiques liées",type:"liees",ref:"PP",groupe:"Physique"},
  {id:"_liees_Morale",label:"Personnes morales liées",type:"liees",ref:"PP",groupe:"Morale"},
  {id:"Projet_de_controle",label:"Projet de contrôle",type:"text"},
  {id:"Dates_de_passage_en_CLIR",label:"Dates de passage en CLIR",type:"date"},
  {id:"Points_vigilance",label:"Points de vigilance",type:"text"},
  {id:"Champs_libre",label:"Champs libre",type:"text"},
];

// Champs d'une action (contrôle ou entrave), dans l'ordre
const ACTION = [
  {id:"Nature_du_controle_entrave",label:"Nature",type:"text"},
  {id:"Categorie",label:"Catégorie",type:"text"},
  {id:"Type_controle",label:"Type",type:"ref"},
  {id:"Type_libre",label:"Type (libre)",type:"text"},
  {id:"Date_declenchement",label:"Date déclenchement",type:"date"},
  {id:"Date_cloture",label:"Date clôture",type:"date"},
  {id:"Date_notification",label:"Date notification",type:"date"},
  {id:"Duree_jours",label:"Durée (jours)",type:"num"},
  {id:"Motif_ERP",label:"Motif ERP",type:"bool"},
  {id:"Service_menant",label:"Service menant",type:"text"},
  {id:"Service_partenaire_1",label:"Services partenaires",type:"list"},
  {id:"Montant_notifie",label:"Montants notifiés (€)",type:"num"},
  {id:"Montant_recouvre",label:"Montants recouvrés (€)",type:"num"},
  {id:"Montant_applicable",label:"Montant applicable (€)",type:"num"},
  {id:"Controles_origine",label:"Contrôle(s) à l'origine",type:"reflist"},
  {id:"Commentaires",label:"Commentaires",type:"text"},
];
// Personnes liées (table Personnes_liees) : sous-champs repris dans la cellule, par type de personne
const LIEES_CHAMPS = {
  Physique: [
    {id:"Fonctions",label:"Fonctions",type:"text"},
    {id:"Nature_des_liens",label:"Nature des liens",type:"text"},
    {id:"Suivi_CLIR",label:"Suivi en CLIR",type:"bool"},
  ],
  Morale: [
    {id:"Activites_reelles",label:"Activités réelles",type:"text"},
    {id:"Nature_des_liens",label:"Nature des liens",type:"text"},
    {id:"Suivi_CLIR",label:"Suivi en CLIR",type:"bool"},
  ],
};
/* ========================= */

const el = id => document.getElementById(id);
function setEtat(msg, cls){ el("etat").textContent = msg||""; el("etat").className = "etat" + (cls?(" "+cls):""); }
function busy(on){ ["btnPM","btnPP","btnTout"].forEach(b=>el(b).disabled=on); }

function toRows(t){ return t.id.map((id,i)=>{ const o={id}; for(const c in t){ if(c!=="id") o[c]=t[c][i]; } return o; }); }

function fmtDate(v){
  if(v===null||v===undefined||v==="") return "";
  const d = new Date((typeof v==="number"? v : Date.parse(v)/1000)*1000);
  if(isNaN(d)) return "";
  const p = n=>String(n).padStart(2,"0");
  return p(d.getUTCDate())+"/"+p(d.getUTCMonth()+1)+"/"+d.getUTCFullYear();
}
function fmt(v, type, ctx){
  if(type==="num") return (v===null||v===undefined||v==="")? "" : v;
  if(v===null||v===undefined||v==="") return "";
  if(type==="date") return fmtDate(v);
  if(type==="list"){ const a = Array.isArray(v)?(v[0]==="L"?v.slice(1):v):[v]; return a.join(" ; "); }
  if(type==="ref") return ctx.typesMap[v] || "";
  if(type==="reflist"){ const a = Array.isArray(v)?(v[0]==="L"?v.slice(1):v):[v]; return a.map(id=>ctx.resumeMap[id]||("#"+id)).join(" ; "); }
  if(type==="bool") return v ? "Oui" : "Non";
  return String(v);
}
// Une cellule par type de personne liée : une personne par ligne dans la cellule
// ex. « Dupont — Fonctions : trésorier — Nature des liens : fondateur — Suivi en CLIR : Oui »
function fmtLiees(e, c, ctx){
  const liste = ((ctx.liees[c.ref]||{})[e.id]||{})[c.groupe] || [];
  return liste.map(p=>{
    const morceaux = [ (p.Pseudonyme||"").trim() || "(sans pseudonyme)" ];
    for(const f of LIEES_CHAMPS[c.groupe]){
      const v = fmt(p[f.id], f.type, ctx);
      if(v!=="" && !(f.type==="bool" && v==="Non")) morceaux.push(f.label+" : "+v);
    }
    return morceaux.join(" — ");
  }).join("\n");
}
// date de référence d'une action (pour le tri) : déclenchement, sinon notification
function dateAction(a){
  const d = a.Date_declenchement || a.Date_notification;
  if(typeof d === "number") return d;
  return d ? (Date.parse(d)/1000) : Number.POSITIVE_INFINITY;
}

function construireFeuille(entites, champsEntite, actionsParEntite, ctx){
  const header = champsEntite.map(c=>c.label);
  for(let n=1;n<=MAX;n++) for(const c of ACTION) header.push("Action "+n+" - "+c.label);
  header.push("Actions supplémentaires");
  const rows = [header];
  for(const e of entites){
    const row = champsEntite.map(c=> c.type==="liees" ? fmtLiees(e, c, ctx) : fmt(e[c.id], c.type, ctx));
    const acts = (actionsParEntite[e.id]||[]).slice().sort((a,b)=>dateAction(a)-dateAction(b));
    for(let n=0;n<MAX;n++){
      const a = acts[n];
      for(const c of ACTION) row.push(a ? fmt(a[c.id], c.type, ctx) : "");
    }
    let sup = "";
    if(acts.length>MAX){
      sup = acts.slice(MAX).map((a,i)=>{
        const champs = ACTION.map(c=>{ const val = fmt(a[c.id], c.type, ctx); return (val==="" || val===undefined)?"":(c.label+"="+val); }).filter(x=>x);
        return "Action "+(MAX+i+1)+" : "+champs.join(", ");
      }).join("  ||  ");
    }
    row.push(sup);
    rows.push(row);
  }
  return rows;
}
function largeurs(rows){
  const w = [];
  for(let c=0;c<rows[0].length;c++){
    let m = 10;
    for(const r of rows){ const len = Math.max(...String(r[c]==null?"":r[c]).split("\n").map(x=>x.length)); if(len>m) m = len; }
    w.push({ wch: Math.min(m+2, 50) });
  }
  return w;
}

async function exporter(mode){
  busy(true); setEtat("Lecture des données…");
  try{
    const [tPM,tPP,tC,tT,tL] = await Promise.all([
      grist.docApi.fetchTable("PM"),
      grist.docApi.fetchTable("PP"),
      grist.docApi.fetchTable("Controles"),
      grist.docApi.fetchTable("Types_controle_entrave"),
      grist.docApi.fetchTable("Personnes_liees").catch(()=>null),  // l'export marche même si la table est inaccessible
    ]);
    const PM = toRows(tPM), PP = toRows(tPP), C = toRows(tC);
    const typesMap = {}; tT.id.forEach((id,i)=>{ typesMap[id] = tT.Libelle[i]; });
    const resumeMap = {}; C.forEach(c=>{ resumeMap[c.id] = c.Resume; });
    // liees[PM|PP][id de la fiche][Physique|Morale] = [personnes], dans l'ordre de saisie
    const liees = { PM:{}, PP:{} };
    for(const p of (tL ? toRows(tL) : [])){
      if(!p.Type_personne) continue;
      const ref = p.PM ? "PM" : (p.PP ? "PP" : null);
      if(!ref) continue;
      const fiche = liees[ref][p[ref]] = liees[ref][p[ref]] || {};
      (fiche[p.Type_personne] = fiche[p.Type_personne] || []).push(p);
    }
    const ctx = { typesMap, resumeMap, liees };

    const parPM = {}, parPP = {};
    for(const c of C){
      if(c.PM){ (parPM[c.PM] = parPM[c.PM]||[]).push(c); }
      else if(c.PP){ (parPP[c.PP] = parPP[c.PP]||[]).push(c); }
    }

    const wb = XLSX.utils.book_new();
    if(mode==="PM" || mode==="TOUT"){
      const rows = construireFeuille(PM, ENTITE_PM, parPM, ctx);
      const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = largeurs(rows);
      XLSX.utils.book_append_sheet(wb, ws, "Personnes morales");
    }
    if(mode==="PP" || mode==="TOUT"){
      const rows = construireFeuille(PP, ENTITE_PP, parPP, ctx);
      const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = largeurs(rows);
      XLSX.utils.book_append_sheet(wb, ws, "Personnes physiques");
    }
    const date = new Date().toISOString().slice(0,10);
    const nom = "export_" + (mode==="TOUT"?"PM_PP":mode) + "_" + date + ".xlsx";
    XLSX.writeFile(wb, nom);

    const nbPM = (mode==="PP")?0:PM.length, nbPP = (mode==="PM")?0:PP.length;
    setEtat("Fichier généré : " + nom + " (" + (nbPM+nbPP) + " entité(s)).", "ok");
  }catch(err){
    console.error(err);
    setEtat("Erreur : " + (err.message || err), "err");
  }finally{
    busy(false);
  }
}

grist.ready({ requiredAccess: "full" });
el("btnPM").onclick   = ()=> exporter("PM");
el("btnPP").onclick   = ()=> exporter("PP");
el("btnTout").onclick = ()=> exporter("TOUT");
</script>
</body>
</html>
