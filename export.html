<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Export CSV — PM + contrôles</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:#2E2E2E; margin:0; padding:20px; background:#fff;}
  h1{font-size:16px; color:#1F4E79; margin:0 0 6px;}
  p.info{font-size:13px; color:#6B7280; margin:0 0 16px;}
  button{font:inherit; cursor:pointer; border:none; border-radius:6px; padding:10px 18px;
     background:#1F4E79; color:#fff; font-weight:500; font-size:14px;}
  button:disabled{opacity:.5; cursor:default;}
  .etat{margin-top:12px; font-size:13px; color:#6B7280;}
  .etat.ok{color:#3B6D11;} .etat.err{color:#b42318;}
</style>
</head>
<body>
  <h1>Export CSV — entités PM et leurs contrôles</h1>
  <p class="info">Génère un fichier CSV en blocs : pour chaque entité, ses informations, puis la liste de ses contrôles et entraves.</p>
  <button id="btn">Télécharger le CSV</button>
  <div class="etat" id="etat"></div>

<script>
/* ===================== CONFIGURATION ===================== */
// Table de l'entité à exporter. Pour exporter les PP, mets "PP" + la liste de champs PP.
const ENTITE = {
  table: "PM",
  nomAffiche: "Pseudonyme",           // sert à titrer chaque bloc
  champs: [
    {id:"Etat_du_dossier", label:"État du dossier", type:"choice"},
    {id:"Affiliation", label:"Affiliation", type:"choice"},
    {id:"Mouvance", label:"Mouvance", type:"choice"},
    {id:"Pseudonyme", label:"Pseudonyme", type:"text"},
    {id:"Objectif", label:"Objectif d'intérêt local / national", type:"choice"},
    {id:"Departement", label:"Département", type:"choice"},
    {id:"Ville", label:"Ville", type:"text"},
    {id:"Autres_adresses", label:"Autres adresses de l'entité", type:"text"},
    {id:"Statut_juridique", label:"Statut juridique", type:"choice"},
    {id:"Date_creation", label:"Date de création de la structure", type:"date"},
    {id:"Numero_RNA", label:"Numéro RNA", type:"text"},
    {id:"Numero_SIRET", label:"Numéro SIRET", type:"text"},
    {id:"Activite_presentiel_ligne", label:"Activité en présentiel ou en ligne", type:"choice"},
    {id:"Domaine_declare_1", label:"Domaines d'activités déclarés", type:"choicelist"},
    {id:"Domaine_reel_2", label:"Domaines d'activités réels", type:"choicelist"},
    {id:"Date_signalement", label:"Date du signalement d'origine", type:"date"},
    {id:"Service_signalant", label:"Service signalant", type:"choice"},
    {id:"Contenu_signalement", label:"Contenu du signalement", type:"text"},
    {id:"Commentaire_signalement", label:"Commentaire", type:"text"},
    {id:"Dirigeants", label:"Dirigeants", type:"text"},
    {id:"Personnels_benevoles", label:"Personnels bénévoles", type:"text"},
    {id:"Personnes_liees_txt", label:"Personnes morales et/ou physiques liées", type:"text"},
    {id:"Fonctions", label:"Fonctions (noms, nature des liens, suivi en CLIR...)", type:"text"},
    {id:"Points_vigilance", label:"Points de vigilance", type:"text"},
    {id:"Projet_controle", label:"Projet de contrôle", type:"text"},
    {id:"Dates_passage_CLIR", label:"Dates de passage en CLIR", type:"text"},
    {id:"Champs_libre", label:"Champs libre (autres éléments de contexte)", type:"text"},
  ]
};

// Table des contrôles reliée à l'entité (refCol = colonne référence vers l'entité)
const CTRL = {
  table: "Controles",
  refCol: "PM",
  typesTable: "Types_controle_entrave",   // pour afficher le libellé du type
  typesLibelle: "Libelle",
  champs: [
    {id:"Nature_du_controle_entrave", label:"Nature", type:"choice"},
    {id:"Categorie", label:"Catégorie", type:"choice"},
    {id:"Type_controle", label:"Type", type:"ref"},
    {id:"Date_declenchement", label:"Date de déclenchement", type:"date"},
    {id:"Date_cloture", label:"Date de clôture", type:"date"},
    {id:"Service_menant", label:"Service menant", type:"choice"},
    {id:"Service_partenaire_1", label:"Services partenaires", type:"choicelist"},
    {id:"Montant_notifie", label:"Montant notifié (€)", type:"number"},
    {id:"Montant_recouvre", label:"Montant recouvré (€)", type:"number"},
    {id:"Commentaires", label:"Commentaires", type:"text"},
  ]
};

const SEP = ";";   // séparateur CSV (le point-virgule ouvre proprement dans Excel français)
/* ======================================================== */

const el = id => document.getElementById(id);

// Convertit une table fetchée (orientée colonnes) en liste de lignes {id, ...}
function toRows(t){
  return t.id.map((id,i)=>{ const o={id}; for(const c in t){ if(c!=="id") o[c]=t[c][i]; } return o; });
}
// Formate une valeur selon son type
function fmt(v, type, typesMap){
  if(v===null || v===undefined || v==="") return "";
  if(type==="date"){
    const d = new Date((typeof v==="number"? v : Date.parse(v)/1000)*1000);
    if(isNaN(d)) return "";
    const p = n=>String(n).padStart(2,"0");
    return p(d.getUTCDate())+"/"+p(d.getUTCMonth()+1)+"/"+d.getUTCFullYear();
  }
  if(type==="choicelist"){ const a = Array.isArray(v) ? (v[0]==="L"?v.slice(1):v) : [v]; return a.join(" ; "); }
  if(type==="ref"){ return typesMap[v] || ""; }
  if(type==="number"){ return String(v).replace(".", ","); }  // virgule décimale FR
  return String(v);
}
// Échappe une cellule CSV
function cell(x){
  x = (x===null||x===undefined) ? "" : String(x);
  if(x.includes(SEP) || x.includes('"') || x.includes("\n")) x = '"' + x.replace(/"/g,'""') + '"';
  return x;
}
const ligne = arr => arr.map(cell).join(SEP);

async function exporter(){
  el("btn").disabled = true;
  el("etat").textContent = "Lecture des données…"; el("etat").className = "etat";
  try{
    // Récupère entités, contrôles et référentiel des types
    const [tEnt, tCtrl, tTypes] = await Promise.all([
      grist.docApi.fetchTable(ENTITE.table),
      grist.docApi.fetchTable(CTRL.table),
      grist.docApi.fetchTable(CTRL.typesTable),
    ]);
    const entites = toRows(tEnt);
    const controles = toRows(tCtrl);
    const typesMap = {}; tTypes.id.forEach((id,i)=>{ typesMap[id] = tTypes[CTRL.typesLibelle][i]; });

    const lignes = [];
    for(const ent of entites){
      const titre = ent[ENTITE.nomAffiche] || ("#"+ent.id);
      lignes.push(ligne(["=== ENTITÉ : " + titre + " ==="]));
      // Infos de l'entité : une ligne de libellés, puis une ligne de valeurs
      lignes.push(ligne(ENTITE.champs.map(c => c.label)));
      lignes.push(ligne(ENTITE.champs.map(c => fmt(ent[c.id], c.type, typesMap))));
      // Contrôles de cette entité
      const siens = controles.filter(x => x[CTRL.refCol] === ent.id);
      lignes.push(ligne([""]));
      lignes.push(ligne(["Contrôles et entraves (" + siens.length + ")"]));
      lignes.push(ligne(CTRL.champs.map(c=>c.label)));   // en-tête du tableau des contrôles
      if(siens.length === 0){
        lignes.push(ligne(["(aucun)"]));
      } else {
        for(const ct of siens){
          lignes.push(ligne(CTRL.champs.map(c => fmt(ct[c.id], c.type, typesMap))));
        }
      }
      lignes.push(ligne([""]));   // séparateur entre entités
      lignes.push(ligne([""]));
    }

    // Fabrique le fichier (BOM UTF-8 pour les accents dans Excel)
    const contenu = "\uFEFF" + lignes.join("\r\n");
    const blob = new Blob([contenu], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0,10);
    a.href = url; a.download = "export_" + ENTITE.table + "_" + date + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

    el("etat").textContent = "Fichier généré : " + entites.length + " entité(s), " + controles.length + " contrôle(s).";
    el("etat").className = "etat ok";
  }catch(err){
    console.error(err);
    el("etat").textContent = "Erreur : " + (err.message || err);
    el("etat").className = "etat err";
  }finally{
    el("btn").disabled = false;
  }
}

grist.ready({ requiredAccess: "full" });
el("btn").onclick = exporter;
</script>
</body>
</html>
