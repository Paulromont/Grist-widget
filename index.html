<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fiche entité — widget Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --bleu:#1F4E79; --bleu-clair:#E6F1FB;
    --orange:#FAEEDA; --orange-txt:#854F0B;
    --vert:#EAF3DE; --vert-txt:#3B6D11;
    --gris:#F4F5F7; --bord:#D8DCE1; --txt:#2E2E2E; --muet:#6B7280;
  }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       color:var(--txt); margin:0; padding:16px; background:#fff; font-size:14px;}
  h2.section{font-size:14px; font-weight:600; color:#fff; background:var(--bleu);
             padding:6px 12px; border-radius:6px; margin:22px 0 12px;}
  .grille{display:grid; grid-template-columns:1fr 1fr; gap:12px 17px;}
  .champ{display:flex; flex-direction:column; gap:4px;}
  .champ.large{grid-column:1 / -1;}
  label{font-size:12px; color:var(--muet);}
  input,select,textarea{font:inherit; padding:6px 8px; border:1px solid var(--bord);
     border-radius:6px; background:#fff; color:var(--txt); width:100%;}
  textarea{min-height:60px; resize:vertical;}
  select[multiple]{min-height:96px;}
  .barre{position:sticky; top:0; z-index:5; background:#fff; padding:8px 0 12px;
     border-bottom:1px solid var(--bord); display:flex; align-items:center; gap:12px;}
  .titre-fiche{font-size:16px; font-weight:600; flex:1;}
  button{font:inherit; cursor:pointer; border:none; border-radius:6px; padding:8px 16px;
     background:var(--bleu); color:#fff; font-weight:500;}
  button.sec{background:var(--gris); color:var(--txt); border:1px solid var(--bord);}
  button:disabled{opacity:.5; cursor:default;}
  .etat{font-size:13px; color:var(--muet);}
  .etat.ok{color:var(--vert-txt);} .etat.err{color:#b42318;}
  .controle{border:1px solid var(--bord); border-radius:8px; padding:12px; margin-bottom:12px; background:var(--gris);}
  .controle .grille{background:transparent;}
  .ctrl-tete{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .ctrl-tete b{font-size:13px;}
  .vide{color:var(--muet); font-style:italic; padding:8px 0;}
  .lien{color:var(--bleu); cursor:pointer; font-size:13px; background:none; padding:2px 6px;}
    /* Menu déroulant à cases */
  .multi{position:relative;}
  .multi-tete{border:1px solid var(--bord); border-radius:6px; padding:6px 8px;
     cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:#fff;}
  .multi-liste{display:none; position:absolute; z-index:10; left:0; right:0; top:100%;
     margin-top:2px; max-height:220px; overflow-y:auto; background:#fff;
     border:1px solid var(--bord); border-radius:6px; padding:6px; box-shadow:0 4px 12px rgba(0,0,0,.12);}
  .multi.ouvert .multi-liste{display:block;}
  .multi .case{display:flex; align-items:center; gap:8px; padding:4px 6px; cursor:pointer;}
  .multi .case:hover{background:var(--gris);}
  .bandeau{background:var(--bleu-clair); border-radius:8px; padding:10px 12px; margin-top:14px;}
  .liees-bloc{margin:4px 0 14px;}
  .liees-titre{font-size:12px; color:var(--muet); margin-bottom:4px;}
  table.liees{width:100%; border-collapse:collapse; background:#fff;}
  table.liees th{font-size:12px; font-weight:500; text-align:left; background:var(--bleu-clair);
     color:var(--bleu); padding:6px 8px; border:1px solid var(--bord);}
  table.liees td{border:1px solid var(--bord); padding:3px;}
  table.liees td input{border:none; padding:5px 6px;}
  table.liees td.centre{text-align:center; width:110px;}
  table.liees td.act{width:44px; text-align:center;}
  table.liees td.vide{text-align:center; border:1px solid var(--bord);}
  button.petit{padding:4px 12px; margin-top:6px; font-size:13px;}
</style>
</head>
<body>

<div class="barre">
  <span class="titre-fiche" id="titre">Aucune fiche sélectionnée</span>
  <span class="etat" id="etat"></span>
  <button class="sec" id="btnAnnuler" disabled>Annuler</button>
  <button id="btnEnregistrer" disabled>Enregistrer</button>
  <button class="sec" id="btnImprimer">Imprimer</button>
</div>

<div id="contenu"><p class="vide">Sélectionne une personne dans la vue reliée pour afficher sa fiche.</p></div>

<script>
const SECTIONS = [
  { titre:null, champs:[
    {id:"Dates_passage_CLIR",  label:"Date(s) de passage en CLIR", type:"text"},
  ]},
  { titre:"Présentation de l'entité", champs:[
    {id:"Etat_du_dossier",  label:"État du dossier", type:"choice"},
    {id:"Affiliation",      label:"Affiliation", type:"choice"},
    {id:"Mouvance",         label:"Mouvance", type:"choice"},
    {id:"Pseudonyme",       label:"Pseudonyme", type:"text"},
    {id:"Objectif",         label:"Objectif d'intérêt local / national", type:"choice", large:true},
    {id:"Ville",            label:"Ville", type:"text"},
    {id:"Autres_adresses",  label:"Autres adresses de l'entité", type:"text"},
    {id:"Statut_juridique", label:"Statut juridique", type:"choice"},
    {id:"Date_creation",    label:"Date de création de la structure", type:"date"},
    {id:"Numero_RNA",       label:"Numéro RNA", type:"text"},
    {id:"Numero_SIRET",     label:"Numéro SIRET", type:"text"},
  ]},
  { titre:"Domaine d'activité", champs:[
    {id:"Activite_presentiel_ligne", label:"Activité en présentiel ou en ligne", type:"choice", large:true},
    {id:"Domaine_declare_1", label:"Domaines d'activités déclarés", type:"choicelist"},
    {id:"Domaine_reel_2",    label:"Domaines d'activités réels", type:"choicelist"},
  ]},
  { titre:"Signalement d'origine", champs:[
    {id:"Date_signalement",       label:"Date du signalement d'origine", type:"date"},
    {id:"Service_signalant",      label:"Service signalant", type:"choice"},
    {id:"Contenu_signalement",    label:"Contenu du signalement", type:"textarea", large:true},
    {id:"Commentaire_signalement",label:"Commentaire", type:"textarea", large:true},
  ]},
  { titre:"Éléments de contexte", champs:[
    {id:"Dirigeants",          label:"Dirigeants", type:"textarea"},
    {id:"Personnels_benevoles",label:"Personnels / bénévoles", type:"textarea"},
    {bloc:"liees"},
    {id:"Points_vigilance",    label:"Points de vigilance", type:"textarea"},
    {id:"Projet_controle",     label:"Projets de contrôle", type:"textarea"},
    {id:"Champs_libre",        label:"Champs libre (autres éléments de contexte)", type:"textarea", large:true},
  ]},
];
const TABLE_ENTITE = "PM";

const LIEES = {
  table:"Personnes_liees", refCol:"PM", typeCol:"Type_personne",
  groupes:[
    { type:"Morale", titre:"Personnes morales liées", cols:[
      {id:"Nom", label:"Nom", type:"text"},
      {id:"Nature_des_liens", label:"Nature des liens", type:"text"},
      {id:"Suivi_CLIR", label:"Suivi en CLIR", type:"bool"},
    ]},
    { type:"Physique", titre:"Personnes physiques liées", cols:[
      {id:"Nom", label:"Nom", type:"text"},
      {id:"Fonctions", label:"Fonctions", type:"text"},
      {id:"Nature_des_liens", label:"Nature des liens", type:"text"},
      {id:"Suivi_CLIR", label:"Suivi en CLIR", type:"bool"},
    ]},
  ]
};

const CONTROLES = {
  table:"Controles", refCol:"PM",
  typesTable:"Types_controle_entrave", typesLibelle:"Libelle", typesCategorie:"Categorie",
  catTable:"Categories", catLibelle:"Cathegorie", catNature:"Nature", catLibre:"type_libre",
  natureCol:"Nature_du_controle_entrave", natureEntrave:"Actions d\u2019entrave",
  champs:[
    {id:"Nature_du_controle_entrave", label:"Nature du contrôle / entrave", type:"choice"},
    {id:"Categorie",           label:"Catégorie de contrôle", type:"refcat"},
    {id:"Type_controle",       label:"Type de contrôle", type:"reftype", large:true},
    {id:"Type_libre",          label:"Type (saisie libre)", type:"text", large:true},
    {id:"Date_declenchement",  label:"Date de déclenchement", type:"date", ctrlOnly:true},
    {id:"Date_cloture",        label:"Date de clôture", type:"date", ctrlOnly:true},
    {id:"Date_notification",   label:"Date de notification", type:"date", entraveOnly:true},
    {id:"Duree_jours",         label:"Durée (en jours) après la date", type:"number",
      cats:["Fermeture du lieu et / ou cessation de l'activité s'y déroulant"]},
    {id:"Service_menant",      label:"Service menant", type:"choice"},
    {id:"Service_partenaire_1",label:"Services partenaires", type:"choicelist"},
    {id:"Motif_ERP",           label:"Motif ERP", type:"bool",
      cats:["Fermeture du lieu et / ou cessation de l'activité s'y déroulant"]},
    {id:"Montant_applicable",  label:"Montant (si applicable)", type:"number",
      cats:["Refus, opposition ou retrait d’un avantage"]},
    {id:"Montant_notifie",     label:"Résultats financiers (montants notifiés)", type:"number",
      cats:["Procédure de contrôle fiscal externe (CFE) ou de contrôle sur pièce (CSP)"]},
    {id:"Montant_recouvre",    label:"Résultats financiers (montants recouvrés)", type:"number",
      cats:["Procédure de contrôle fiscal externe (CFE) ou de contrôle sur pièce (CSP)",
             "Procédure de contrôle des OSBL (à détailler)"]},
    {id:"Commentaires",        label:"Commentaires", type:"textarea", large:true},
    {id:"Controles_origine",   label:"Contrôle(s) à l'origine de l'entrave", type:"reflistctrl", entraveOnly:true, large:true},
  ]
};

let recordActuel = null;
let choix = {};
let typesRows = [];
let controlesActuels = [];
let modifie = false;

const el = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ouvrirFermer(tete){
  const boite = tete.parentElement;
  boite.classList.toggle("ouvert");
  document.querySelectorAll(".multi.ouvert").forEach(m=>{ if(m!==boite) m.classList.remove("ouvert"); });
}
document.addEventListener("click", e=>{
  if(!e.target.closest(".multi")) document.querySelectorAll(".multi.ouvert").forEach(m=>m.classList.remove("ouvert"));
});
function dateVersInput(v){
  if(v==null||v==="") return "";
  const d = new Date((typeof v==="number"? v : Date.parse(v)/1000)*1000);
  if(isNaN(d)) return "";
  return d.toISOString().slice(0,10);
}
function inputVersDate(s){
  if(!s) return null;
  const [y,m,d] = s.split("-").map(Number);
  return Date.UTC(y, m-1, d)/1000;
}
function listeVersTab(v){
  if(Array.isArray(v)) return v[0]==="L" ? v.slice(1) : v;
  return v ? [v] : [];
}
function tabVersListe(t){ return ["L", ...t]; }

async function chargerChoix(){
  const [tables, cols] = await Promise.all([
    grist.docApi.fetchTable("_grist_Tables"),
    grist.docApi.fetchTable("_grist_Tables_column"),
  ]);
  const refVersId = {};
  tables.id.forEach((rid,i)=>{ refVersId[rid] = tables.tableId[i]; });
  choix = {};
  cols.id.forEach((_,i)=>{
    const t = refVersId[cols.parentId[i]];
    const colId = cols.colId[i];
    let opts=[];
    try{ const wo = JSON.parse(cols.widgetOptions[i]||"{}"); opts = wo.choices||[]; }catch(e){}
    if(t){ (choix[t] = choix[t]||{})[colId] = opts; }
  });
}
async function chargerTypes(){
  const t = await grist.docApi.fetchTable(CONTROLES.typesTable);
  typesRows = t.id.map((id,i)=>({
    id, libelle:t[CONTROLES.typesLibelle][i], categorie:t[CONTROLES.typesCategorie][i]
  }));
}
function libelleType(id){
  const r = typesRows.find(t=>t.id===id);
  return r ? r.libelle : null;
}
let catRows = [];
async function chargerCategories(){
  const t = await grist.docApi.fetchTable(CONTROLES.catTable);
  catRows = t.id.map((id,i)=>({ libelle:t[CONTROLES.catLibelle][i], nature:t[CONTROLES.catNature][i], libre:t[CONTROLES.catLibre][i] }));
}
async function chargerControles(pmId){
  const t = await grist.docApi.fetchTable(CONTROLES.table);
  controlesActuels = t.id.map((id,i)=>{
    const o={id}; Object.keys(t).forEach(c=>{ if(c!=="id") o[c]=t[c][i]; }); return o;
  }).filter(r => r[CONTROLES.refCol]===pmId);
}
function champHTML(champ, valeur, prefix, ctrlCat, ctrlNat){
  const nom = prefix + champ.id;
  if(champ.type==="text")
    return `<input id="${nom}" value="${esc(valeur||"")}">`;
  if(champ.type==="textarea")
    return `<textarea id="${nom}">${esc(valeur||"")}</textarea>`;
  if(champ.type==="date")
    return `<input type="date" id="${nom}" value="${dateVersInput(valeur)}">`;
  if(champ.type==="choice"){
    const table = prefix.startsWith("ctrl") ? CONTROLES.table : TABLE_ENTITE;
    let opts = (choix[table]&&choix[table][champ.id])||[];
    if(champ.id === CONTROLES.natureCol) opts = opts.filter(o => o !== CONTROLES.natureEntrave);
    return `<select id="${nom}"><option value=""></option>`+
      opts.map(o=>`<option ${o===valeur?"selected":""} value="${esc(o)}">${esc(o)}</option>`).join("")+
      `</select>`;
  }
  if(champ.type==="choicelist"){
    const table = prefix.startsWith("ctrl") ? CONTROLES.table : TABLE_ENTITE;
    const opts = (choix[table]&&choix[table][champ.id])||[];
    const sel = listeVersTab(valeur);
    return `<select id="${nom}" multiple size="4">`+
        opts.map(o=>`<option ${sel.includes(o)?"selected":""} value="${esc(o)}">${esc(o)}</option>`).join("")+
      `</select>`;
  }
  if(champ.type==="reftype"){
    const dispo = typesRows.filter(r=>!ctrlCat || r.categorie===ctrlCat);
    return `<select id="${nom}"><option value=""></option>`+
      dispo.map(r=>`<option ${r.id===valeur?"selected":""} value="${r.id}">${esc(r.libelle)}</option>`).join("")+
      `</select>`;
  }
  if(champ.type==="refcat"){
    const dispo = catRows.filter(r=>!ctrlNat || r.nature===ctrlNat);
    return `<select id="${nom}"><option value=""></option>`+
      dispo.map(r=>`<option ${r.libelle===valeur?"selected":""} value="${esc(r.libelle)}">${esc(r.libelle)}</option>`).join("")+
      `</select>`;
  }
  if(champ.type==="reflistctrl"){
    // liste des contrôles (hors entraves) déjà enregistrés de la même entité
    const dispo = controlesActuels.filter(x => x.id && x[CONTROLES.natureCol] !== CONTROLES.natureEntrave);
    const sel = listeVersTab(valeur).map(Number);
    const opts = dispo.map(x=>`<option ${sel.includes(x.id)?"selected":""} value="${x.id}">${esc(x.Resume||("#"+x.id))}</option>`).join("");
    return `<select id="${nom}" multiple size="4">${opts}</select>`+
      (dispo.length ? "" : `<div class="vide" style="padding:4px 0;">Aucun contrôle enregistré à lier (enregistrez d'abord le contrôle).</div>`);
  }
  if(champ.type==="number"){
    return `<input type="number" step="0.01" id="${nom}" value="${valeur!=null?esc(valeur):""}">`;
  }
  if(champ.type==="bool"){
    return `<input type="checkbox" id="${nom}" style="width:auto;height:18px;" ${valeur?"checked":""}>`;
  }
  return "";
}
function lireChamp(champ, prefix){
  const n = document.getElementById(prefix+champ.id);
  if(!n) return undefined;
  if(champ.type==="date")       return inputVersDate(n.value);
  if(champ.type==="reftype")    return n.value? Number(n.value) : 0;
  if(champ.type==="number")     return n.value===""? null : parseFloat(n.value);
  if(champ.type==="reflistctrl")return tabVersListe([...n.selectedOptions].map(o=>Number(o.value)));
  if(champ.type==="bool")       return n.checked;
  if(champ.type==="choicelist") return tabVersListe([...n.selectedOptions].map(o=>o.value));
  return n.value;
}
function rendre(){
  if(!recordActuel){ el("contenu").innerHTML = `<p class="vide">Aucune fiche s\u00e9lectionn\u00e9e.</p>`; return; }
  let html = "";
  for(const sec of SECTIONS){
    html += sec.titre ? `<h2 class="section">${esc(sec.titre)}</h2><div class="grille">` : `<div class="grille bandeau">`;
    for(const c of sec.champs){
      if(c.bloc==="liees"){ html += `</div><div id="zoneLiees"></div><div class="grille">`; continue; }
      html += `<div class="champ ${c.large?"large":""}"><label>${esc(c.label)}</label>${champHTML(c, recordActuel[c.id], "pm_")}</div>`;
    }
    html += `</div>`;
  }
  html += `<h2 class="section">Actions de contr\u00f4le</h2><div id="zoneCtrl"></div>
           <button class="sec" id="btnAddCtrl">+ Ajouter un contr\u00f4le</button>`;
  html += `<h2 class="section">Actions d'entrave</h2><div id="zoneEntrave"></div>
           <button class="sec" id="btnAddEntrave">+ Ajouter une entrave</button>`;
  el("contenu").innerHTML = html;
  rendreLiees();
  rendreControles();
  el("btnAddCtrl").onclick = ajouterControle;
  el("btnAddEntrave").onclick = ajouterEntrave;
  el("contenu").addEventListener("input", ()=>marquerModifie());
  el("contenu").addEventListener("change", e=>{
    if(e.target.id && e.target.id.match(/^ctrl\d+_(Nature_du_controle_entrave|Categorie|Type_controle)$/)){ capturerControles(); rendreControles(true); }
    marquerModifie();
  });
}
function catEstLibre(cat){
  const r = catRows.find(x => x.libelle === cat);
  return r ? !!r.libre : false;
}
function rendreControles(depuisChangement){
  const zC = el("zoneCtrl"), zE = el("zoneEntrave");
  if(!zC && !zE) return;
  let htmlC = "", htmlE = "", nC = 0, nE = 0;
  controlesActuels.forEach((ctrl, idx)=>{
    const cat = ctrl.Categorie;
    const nat = ctrl[CONTROLES.natureCol];
    const estEntrave = (nat === CONTROLES.natureEntrave);
    const typeLib = libelleType(ctrl.Type_controle);
    const titre = estEntrave ? ("Entrave " + (++nE)) : ("Contr\u00f4le " + (++nC));
    let h = `<div class="controle"><div class="ctrl-tete"><b>${titre}</b> <button class="lien" data-sup="${idx}">supprimer</button></div><div class="grille">`;
    for(const c of CONTROLES.champs){
      if(estEntrave && c.id === CONTROLES.natureCol) continue;
      if(c.ctrlOnly && estEntrave) continue;
      if(c.entraveOnly && !estEntrave) continue;
      if(c.cats && !c.cats.includes(cat)) continue;
      if(c.id === "Type_controle" && catEstLibre(cat)) continue;
      if(c.id === "Type_libre" && !catEstLibre(cat)) continue;
      h += `<div class="champ ${c.large?"large":""}"><label>${esc(c.label)}</label>${champHTML(c, ctrl[c.id], "ctrl"+idx+"_", cat ,nat)}</div>`;
    }
    h += `</div></div>`;
    if(estEntrave) htmlE += h; else htmlC += h;
  });
  if(zC) zC.innerHTML = htmlC || `<p class="vide">Aucun contr\u00f4le pour cette entit\u00e9.</p>`;
  if(zE) zE.innerHTML = htmlE || `<p class="vide">Aucune entrave pour cette entit\u00e9.</p>`;
  document.querySelectorAll("[data-sup]").forEach(b=> b.onclick = ()=>{
    capturerControles(); controlesActuels.splice(Number(b.dataset.sup),1); marquerModifie(); rendreControles();
  });
}
function capturerControles(){
  controlesActuels.forEach((ctrl, idx)=>{
    const ancienneNature = ctrl[CONTROLES.natureCol];
    const ancienneCat = ctrl.Categorie;
    for(const c of CONTROLES.champs){
      const v = lireChamp(c, "ctrl"+idx+"_");
      if(v!==undefined) ctrl[c.id] = v;
    }
    if(ctrl[CONTROLES.natureCol] !== ancienneNature){
      ctrl.Categorie = null;
      ctrl.Type_controle = 0;
    }
    else if(ctrl.Categorie !== ancienneCat){
      ctrl.Type_controle = 0;
    }
  });
}
function ajouterControle(){
  const vide = {id:null, [CONTROLES.refCol]:recordActuel.id};
  CONTROLES.champs.forEach(c=> vide[c.id] = c.type==="choicelist"?["L"]:null);
  controlesActuels.push(vide); marquerModifie(); rendreControles();
}
function ajouterEntrave(){
  const vide = {id:null, [CONTROLES.refCol]:recordActuel.id};
  CONTROLES.champs.forEach(c=> vide[c.id] = c.type==="choicelist"?["L"]:null);
  vide[CONTROLES.natureCol] = CONTROLES.natureEntrave;
  controlesActuels.push(vide); marquerModifie(); rendreControles();
}
function marquerModifie(){ modifie=true; el("btnEnregistrer").disabled=false; el("btnAnnuler").disabled=false; el("etat").textContent=""; }
async function enregistrer(){
  if(!recordActuel) return;
  el("btnEnregistrer").disabled = true;
  el("etat").textContent = "Enregistrement\u2026"; el("etat").className="etat";
  try{
    const champsPM = {};
    for(const sec of SECTIONS) for(const c of sec.champs){
      if(c.bloc || c.id === "Departement") continue;   // département géré automatiquement + verrouillé : ne pas l'enregistrer
      const v = lireChamp(c, "pm_"); if(v!==undefined) champsPM[c.id]=v;
    }
    await grist.selectedTable.update({ id: recordActuel.id, fields: champsPM });
    const actions = [];
    controlesActuels.forEach((ctrl, idx)=>{
      const fields = { [CONTROLES.refCol]: recordActuel.id };
      // une entrave a sa Nature masquée : on la force pour ne pas la perdre à l'enregistrement
      if(ctrl[CONTROLES.natureCol] === CONTROLES.natureEntrave) fields[CONTROLES.natureCol] = CONTROLES.natureEntrave;
      for(const c of CONTROLES.champs){
        const v = lireChamp(c, "ctrl"+idx+"_"); if(v!==undefined) fields[c.id]=v;
      }
      if(ctrl.id) actions.push(["UpdateRecord", CONTROLES.table, ctrl.id, fields]);
      else        actions.push(["AddRecord",    CONTROLES.table, null,     fields]);
    });
    (window._ctrlOrigIds||[]).forEach(id=>{
      if(!controlesActuels.some(c=>c.id===id)) actions.push(["RemoveRecord", CONTROLES.table, id]);
    });
    actions.push(...actionsLiees());
    if(actions.length) await grist.docApi.applyUserActions(actions);
    modifie=false; el("btnAnnuler").disabled=true;
    el("etat").textContent = "Enregistr\u00e9 \u2713"; el("etat").className="etat ok";
  }catch(err){
    console.error(err);
    el("etat").textContent = "Erreur : "+(err.message||err); el("etat").className="etat err";
    el("btnEnregistrer").disabled=false;
  }
}
function valeurAffichee(champ, valeur){
  if(champ.type==="date"){ const d=dateVersInput(valeur); return d ? d.split("-").reverse().join("/") : ""; }
  if(champ.type==="reflistctrl"){
    return listeVersTab(valeur).map(Number).map(id=>{ const c=controlesActuels.find(x=>x.id===id); return c?(c.Resume||("#"+id)):("#"+id); }).join(" ; ");
  }
  if(champ.type==="choicelist") return listeVersTab(valeur).join(", ");
  if(champ.type==="reftype"){ const r=typesRows.find(x=>x.id===valeur); return r ? r.libelle : ""; }
  if(champ.type==="refcat") return valeur==null ? "" : String(valeur);
  if(champ.type==="number") return (valeur==null||valeur==="") ? "" : valeur+" \u20ac";
  if(champ.type==="bool") return valeur ? "Oui" : "Non";
  return (valeur==null) ? "" : String(valeur);
}
function imprimerFiche(){
  if(!recordActuel){ return; }
  const titre = "Fiche : " + (recordActuel.Pseudonyme || recordActuel.Mouvance || ("#"+recordActuel.id));
  let corps = "";
  for(const sec of SECTIONS){
    let bloc = "", lignes = "";
    const vider = ()=>{ if(lignes){ bloc += `<table class="ch">${lignes}</table>`; lignes = ""; } };
    for(const c of sec.champs){
      if(c.bloc==="liees"){ vider(); bloc += lieesImpression(); continue; }
      const v = valeurAffichee(c, recordActuel[c.id]);
      if(v!=="") lignes += `<tr><td class="lbl">${esc(c.label)}</td><td>${esc(v)}</td></tr>`;
    }
    vider();
    if(bloc) corps += sec.titre ? `<h2>${esc(sec.titre)}</h2>${bloc}` : bloc;
  }
  corps += `<h2>Contr\u00f4les et entraves</h2>`;
  if(!controlesActuels.length){ corps += `<p><i>Aucun contr\u00f4le.</i></p>`; }
  controlesActuels.forEach((ctrl, idx)=>{
    const nat = ctrl[CONTROLES.natureCol], cat = ctrl.Categorie;
    let lignes = "";
    const estEntraveP = (nat === CONTROLES.natureEntrave);
    for(const c of CONTROLES.champs){
      if(estEntraveP && c.id===CONTROLES.natureCol) continue;
      if(c.ctrlOnly && estEntraveP) continue;
      if(c.entraveOnly && !estEntraveP) continue;
      if(c.cats && !c.cats.includes(cat)) continue;
      if(c.id==="Categorie" && !nat) continue;
      if(c.id==="Type_controle" && (!cat || catEstLibre(cat))) continue;
      if(c.id==="Type_libre" && !catEstLibre(cat)) continue;
      const v = valeurAffichee(c, ctrl[c.id]);
      if(v!=="") lignes += `<tr><td class="lbl">${esc(c.label)}</td><td>${esc(v)}</td></tr>`;
    }
    corps += `<h3>${(nat===CONTROLES.natureEntrave?"Entrave":"Contr\u00f4le")} ${idx+1}</h3><table class="ch">${lignes}</table>`;
  });
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(titre)}</title>
    <style>
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body{font-family:Arial,sans-serif; color:#222; margin:24px; font-size:12px;}
      h1{font-size:18px; color:#1F4E79; border-bottom:2px solid #1F4E79; padding-bottom:4px;}
      h2{font-size:13px; color:#fff; background:#1F4E79; padding:4px 8px; margin:16px 0 6px; border-radius:3px;}
      h3{font-size:12px; margin:12px 0 4px; color:#1F4E79;}
      table.ch{width:100%; border-collapse:collapse; margin-bottom:8px;}
      table.ch td{border:0.5px solid #ccc; padding:4px 6px; vertical-align:top;}
      td.lbl{width:32%; color:#555; background:#f4f5f7;}
      table.lie{width:100%; border-collapse:collapse; margin-bottom:8px;}
      table.lie th{background:#E6F1FB; color:#1F4E79; text-align:left; font-weight:600; border:0.5px solid #ccc; padding:4px 6px;}
      table.lie td{border:0.5px solid #ccc; padding:4px 6px;}
      @media print{ body{margin:0;} }
    </style></head><body><h1>${esc(titre)}</h1>${corps}</body></html>`;
  const w = window.open("", "_blank");
  if(!w){ alert("Autorise les fen\u00eatres pop-up pour pouvoir imprimer."); return; }
  w.document.write(html); w.document.close(); w.focus();
  setTimeout(()=>w.print(), 300);
}

/* ---------- Personnes liées (table Personnes_liees) ---------- */
let lieesActuelles = [];
let lieesDispo = true;
async function chargerLiees(entiteId){
  try{
    const t = await grist.docApi.fetchTable(LIEES.table);
    lieesDispo = true;
    lieesActuelles = t.id.map((id,i)=>{
      const o={id}; Object.keys(t).forEach(c=>{ if(c!=="id") o[c]=t[c][i]; }); return o;
    }).filter(r => r[LIEES.refCol]===entiteId);
  }catch(e){
    console.warn("Table Personnes_liees indisponible :", e);
    lieesDispo = false; lieesActuelles = [];
  }
}
function capturerLiees(){
  lieesActuelles.forEach((p, idx)=>{
    const g = LIEES.groupes.find(x=>x.type===p[LIEES.typeCol]); if(!g) return;
    for(const c of g.cols){
      const n = document.getElementById("lie"+idx+"_"+c.id); if(!n) continue;
      p[c.id] = c.type==="bool" ? n.checked : n.value;
    }
  });
}
function rendreLiees(){
  const z = el("zoneLiees"); if(!z) return;
  if(!lieesDispo){
    z.innerHTML = `<p class="etat err">Table \u00ab ${LIEES.table} \u00bb introuvable dans le document (ou non accessible) : cr\u00e9e-la pour activer les personnes li\u00e9es.</p>`;
    return;
  }
  let html = "";
  for(const g of LIEES.groupes){
    let lignes = "";
    lieesActuelles.forEach((p, idx)=>{
      if(p[LIEES.typeCol]!==g.type) return;
      lignes += "<tr>" + g.cols.map(c=>{
        const nom = "lie"+idx+"_"+c.id;
        if(c.type==="bool") return `<td class="centre"><input type="checkbox" id="${nom}" style="width:auto;height:18px;" ${p[c.id]?"checked":""}></td>`;
        return `<td><input id="${nom}" value="${esc(p[c.id]||"")}"></td>`;
      }).join("") + `<td class="act"><button class="lien" title="Supprimer" data-suplie="${idx}">\u2715</button></td></tr>`;
    });
    if(!lignes) lignes = `<tr><td class="vide" colspan="${g.cols.length+1}">Aucune</td></tr>`;
    html += `<div class="liees-bloc"><div class="liees-titre">${esc(g.titre)}</div>
      <table class="liees"><thead><tr>${g.cols.map(c=>`<th>${esc(c.label)}</th>`).join("")}<th></th></tr></thead>
      <tbody>${lignes}</tbody></table>
      <button class="sec petit" data-addlie="${esc(g.type)}">+ Ajouter</button></div>`;
  }
  z.innerHTML = html;
  z.querySelectorAll("[data-suplie]").forEach(b=> b.onclick = ()=>{
    capturerLiees(); lieesActuelles.splice(Number(b.dataset.suplie),1); marquerModifie(); rendreLiees();
  });
  z.querySelectorAll("[data-addlie]").forEach(b=> b.onclick = ()=>{
    capturerLiees();
    const g = LIEES.groupes.find(x=>x.type===b.dataset.addlie);
    const vide = {id:null, [LIEES.refCol]:recordActuel.id, [LIEES.typeCol]:g.type};
    g.cols.forEach(c=> vide[c.id] = c.type==="bool" ? false : "");
    lieesActuelles.push(vide); marquerModifie(); rendreLiees();
  });
}
function actionsLiees(){
  if(!lieesDispo) return [];
  capturerLiees();
  const actions = [];
  lieesActuelles.forEach(p=>{
    const g = LIEES.groupes.find(x=>x.type===p[LIEES.typeCol]); if(!g) return;
    const fields = { [LIEES.refCol]: recordActuel.id, [LIEES.typeCol]: g.type };
    g.cols.forEach(c=> fields[c.id] = c.type==="bool" ? !!p[c.id] : (p[c.id]||""));
    const videTotal = g.cols.every(c=> c.type==="bool" ? !p[c.id] : !String(p[c.id]||"").trim());
    if(p.id) actions.push(["UpdateRecord", LIEES.table, p.id, fields]);
    else if(!videTotal) actions.push(["AddRecord", LIEES.table, null, fields]);
  });
  (window._lieesOrigIds||[]).forEach(id=>{
    if(!lieesActuelles.some(p=>p.id===id)) actions.push(["RemoveRecord", LIEES.table, id]);
  });
  return actions;
}
function lieesImpression(){
  let h = "";
  for(const g of LIEES.groupes){
    const rows = lieesActuelles.filter(p=>p[LIEES.typeCol]===g.type);
    if(!rows.length) continue;
    h += `<h3>${esc(g.titre)}</h3><table class="lie"><tr>${g.cols.map(c=>`<th>${esc(c.label)}</th>`).join("")}</tr>` +
      rows.map(p=>"<tr>"+g.cols.map(c=>`<td>${c.type==="bool"?(p[c.id]?"Oui":"Non"):esc(p[c.id]||"")}</td>`).join("")+"</tr>").join("") +
      `</table>`;
  }
  return h;
}
el("btnImprimer").onclick = imprimerFiche;
el("btnEnregistrer").onclick = enregistrer;
el("btnAnnuler").onclick = ()=>{ if(recordActuel) chargerFiche(recordActuel); };
async function chargerFiche(rec){
  recordActuel = rec;
  el("titre").textContent = "Fiche : " + (rec.Pseudonyme || rec.Mouvance || ("#"+rec.id));
  await chargerControles(rec.id);
  window._ctrlOrigIds = controlesActuels.map(c=>c.id);
  await chargerLiees(rec.id);
  window._lieesOrigIds = lieesActuelles.map(p=>p.id);
  modifie=false; el("btnEnregistrer").disabled=true; el("btnAnnuler").disabled=true; el("etat").textContent="";
  rendre();
}
grist.ready({ requiredAccess:"full" });
Promise.all([chargerChoix(), chargerTypes(), chargerCategories()]).then(()=>{
  grist.onRecord(async (record)=>{ await chargerFiche(record); });
}).catch(e=>{ el("contenu").innerHTML = `<p class="etat err">Erreur d'initialisation : ${esc(e.message||e)}</p>`; });
document.addEventListener('mousedown', function(e) {
  const option = e.target;
  if (option.tagName === 'OPTION' && option.parentNode.multiple) {
    e.preventDefault();
    const select = option.parentNode;
    option.selected = !option.selected;
    select.focus();
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }
}, true);
</script>
